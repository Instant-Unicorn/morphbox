# MorphBox tmux configuration for better terminal compatibility

# Set default terminal
set -g default-terminal "xterm-256color"

# Enable true color support
set -ga terminal-overrides ",xterm-256color:Tc"

# Fix escape time for better responsiveness
set -sg escape-time 0

# Enable mouse support (for scrolling)
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Don't rename windows automatically
set -g allow-rename off

# Status bar settings
set -g status off

# Fix clipboard
set -g set-clipboard on

# Ensure proper TERM inside tmux
set-environment -g TERM "xterm-256color"

# Pane resizing key bindings
# Use Alt+Left/Right to resize horizontally
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
# Use Alt+Up/Down to resize vertically
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# Alternative: Use Ctrl+Shift+Arrow keys
bind -n C-S-Left resize-pane -L 2
bind -n C-S-Right resize-pane -R 2
bind -n C-S-Up resize-pane -U 2
bind -n C-S-Down resize-pane -D 2

# Enable pane resizing with mouse drag
set -g mouse-resize-pane on

# Pane border settings for better visibility
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Show pane numbers longer when displaying them
set -g display-panes-time 2000